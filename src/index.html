<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>FirmaLink — Sistema de Gestión</title>
  <base href="./">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5, user-scalable=yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0c2d48">
  <link rel="icon" type="image/png" href="assets/images/logo.png">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <style type="text/css">
    #loading-bg {
      width: 100%;
      height: 100%;
      background: #fff;
      display: block;
      position: absolute;
      z-index: 99999;
      pointer-events: none;
    }

    .loading-logo {
      position: absolute;
      left: 50%;
      top: 35%;
      transform: translateX(-50%);
      animation: floatAndPulse 3s ease-in-out infinite;
    }

    .loading-logo svg {
      width: 320px;
      height: auto;
      display: block;
      overflow: visible;
    }

    /* --- Isotipo animado: eslabones + check --- */
    @keyframes isoLinkEntrance {
      0% {
        transform: scale(0.75);
        opacity: 0;
      }
      70% {
        transform: scale(1.02);
        opacity: 1;
      }
      100% {
        transform: scale(1);
        opacity: 1;
      }
    }

    @keyframes isoDrawCheck {
      0% {
        stroke-dashoffset: 260;
        opacity: 0;
      }
      20% {
        opacity: 1;
      }
      100% {
        stroke-dashoffset: 0;
        opacity: 1;
      }
    }

    @keyframes isoLoopLinks {
      0% {
        transform: scale(0.82);
        opacity: 0;
      }
      14% {
        transform: scale(1);
        opacity: 1;
      }
      82% {
        transform: scale(1);
        opacity: 1;
      }
      100% {
        transform: scale(1);
        opacity: 0;
      }
    }

    @keyframes isoLoopCheck {
      0% {
        stroke-dashoffset: 260;
        opacity: 1;
      }
      22% {
        stroke-dashoffset: 260;
        opacity: 1;
      }
      52% {
        stroke-dashoffset: 0;
        opacity: 1;
      }
      82% {
        stroke-dashoffset: 0;
        opacity: 1;
      }
      100% {
        stroke-dashoffset: 0;
        opacity: 0;
      }
    }

    .iso-anim-links {
      transform-origin: 200px 130px;
      animation: isoLoopLinks 2.4s ease-in-out infinite;
    }

    .iso-anim-check {
      stroke-dasharray: 260;
      stroke-dashoffset: 260;
      animation: isoLoopCheck 2.4s ease-in-out infinite;
    }

    .loading {
      position: absolute;
      left: 50%;
      top: calc(35% + 240px);
      width: 200px;
      height: 4px;
      background-color: #f0f0f0;
      border-radius: 2px;
      transform: translateX(-50%);
      overflow: hidden;
      animation: fadeIn 0.8s ease-out;
    }

    .loading::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 50%;
      height: 100%;
      background-color: var(--accent, #00c9a7);
      border-radius: 2px;
      animation: progressBar 2.5s ease-in-out infinite;
    }

    @keyframes floatAndPulse {
      0% {
        transform: translateX(-50%) translateY(0) scale(1);
        opacity: 1;
      }
      50% {
        transform: translateX(-50%) translateY(-10px) scale(1.03);
        opacity: 0.95;
      }
      100% {
        transform: translateX(-50%) translateY(0) scale(1);
        opacity: 1;
      }
    }

    @keyframes progressBar {
      0% {
        left: -50%;
        width: 50%;
      }
      40% {
        width: 35%;
      }
      50% {
        left: 50%;
        width: 30%;
      }
      100% {
        left: 100%;
        width: 70%;
      }
    }
  </style>
</head>
<body class="mat-typography">
  <core-loading-screen id="loading-bg">
    <div class="loading-logo" id="loading-logo-container">
      <!-- Isotipo animado (misma composición que el login, en bucle) -->
      <svg
        width="320"
        height="208"
        viewBox="0 0 400 260"
        fill="none"
        xmlns="http://www.w3.org/2000/svg"
        role="img"
        aria-label="Cargando FirmaLink"
      >
        <defs>
          <mask
            id="iso-cut-mask-loader"
            maskUnits="userSpaceOnUse"
            x="0"
            y="0"
            width="400"
            height="260"
          >
            <rect x="0" y="0" width="400" height="260" fill="#fff" />
            <path d="M 160 130 A 45 45 0 0 0 205 175" stroke="#000" stroke-width="38" fill="none" />
            <path
              d="M 160 130 A 45 45 0 0 0 205 175"
              stroke="#000"
              stroke-width="38"
              stroke-linecap="round"
              fill="none"
            />
            <path
              class="iso-anim-check"
              d="M 205 130 L 235 160 L 315 65"
              stroke="#000"
              stroke-width="38"
              stroke-linecap="round"
              stroke-linejoin="round"
              fill="none"
            />
            <path
              class="iso-anim-check"
              d="M 205 130 L 235 160 L 315 65"
              stroke="#fff"
              stroke-width="22"
              stroke-linecap="round"
              stroke-linejoin="round"
              fill="none"
            />
          </mask>
        </defs>

        <g class="iso-anim-links">
          <g mask="url(#iso-cut-mask-loader)">
            <rect
              x="50"
              y="85"
              width="150"
              height="90"
              rx="45"
              style="stroke: var(--primary, #0c2d48)"
              stroke-width="26"
              fill="none"
            />
            <rect
              x="160"
              y="85"
              width="150"
              height="90"
              rx="45"
              style="stroke: var(--accent, #00c9a7)"
              stroke-width="26"
              fill="none"
            />
          </g>
          <path
            d="M 160 130 A 45 45 0 0 0 205 175"
            style="stroke: var(--primary, #0c2d48)"
            stroke-width="26"
            fill="none"
          />
        </g>

        <g class="iso-anim-check">
          <path
            d="M 205 130 L 235 160 L 315 65"
            style="stroke: var(--accent, #00c9a7)"
            stroke-width="22"
            stroke-linecap="round"
            stroke-linejoin="round"
            fill="none"
          />
        </g>
      </svg>
    </div>
    <div class="loading"></div>
  </core-loading-screen>
  <app-root></app-root>

  <script>
    (function () {
      // Escuchar mensajes del desktop container (Tauri/Electron)
      window.addEventListener('message', (event) => {
        if (event.data.type === 'NETWORK_CONTEXT') {
          sessionStorage.setItem('net_info', JSON.stringify(event.data.payload));
        }
        if (event.data.type === 'SET_SESSION') {
          sessionStorage.setItem('token_sandra', event.data.token);
        }
      });
    })();
  </script>
</body>
</html>
