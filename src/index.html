<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>FirmaLink — Sistema de Gestión</title>
  <base href="./">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5, user-scalable=yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0c2d48">
  <link rel="icon" type="image/png" href="assets/images/logo.png">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <style type="text/css">
    #loading-bg {
      width: 100%;
      height: 100%;
      background: #fff;
      display: block;
      position: absolute;
      z-index: 99999;
      pointer-events: none;
    }

    .loading-logo {
      position: absolute;
      left: 50%;
      top: 35%;
      transform: translateX(-50%);
      animation: floatAndPulse 3s ease-in-out infinite;
    }

    .loading-logo svg {
      width: 320px;
      height: auto;
      display: block;
      overflow: visible;
    }

    /* --- Isotipo animado: eslabones + check --- */
    @keyframes isoLinkEntrance {
      0% {
        transform: scale(0.75);
        opacity: 0;
      }
      70% {
        transform: scale(1.02);
        opacity: 1;
      }
      100% {
        transform: scale(1);
        opacity: 1;
      }
    }

    @keyframes isoDrawCheck {
      0% {
        stroke-dashoffset: 260;
        opacity: 0;
      }
      20% {
        opacity: 1;
      }
      100% {
        stroke-dashoffset: 0;
        opacity: 1;
      }
    }

    @keyframes isoLoopLinks {
      0% {
        transform: scale(0.82);
        opacity: 0;
      }
      14% {
        transform: scale(1);
        opacity: 1;
      }
      82% {
        transform: scale(1);
        opacity: 1;
      }
      100% {
        transform: scale(1);
        opacity: 0;
      }
    }

    @keyframes isoLoopCheck {
      0% {
        stroke-dashoffset: 260;
        opacity: 1;
      }
      22% {
        stroke-dashoffset: 260;
        opacity: 1;
      }
      52% {
        stroke-dashoffset: 0;
        opacity: 1;
      }
      82% {
        stroke-dashoffset: 0;
        opacity: 1;
      }
      100% {
        stroke-dashoffset: 0;
        opacity: 0;
      }
    }

    .iso-anim-links {
      transform-origin: 200px 130px;
      animation: isoLoopLinks 2.4s ease-in-out infinite;
    }

    .iso-anim-check {
      stroke-dasharray: 260;
      stroke-dashoffset: 260;
      animation: isoLoopCheck 2.4s ease-in-out infinite;
    }

    .loading {
      position: absolute;
      left: 50%;
      top: calc(35% + 240px);
      width: 200px;
      height: 4px;
      background-color: #f0f0f0;
      border-radius: 2px;
      transform: translateX(-50%);
      overflow: hidden;
      animation: fadeIn 0.8s ease-out;
    }

    .loading::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 50%;
      height: 100%;
      background-color: var(--accent, #00c9a7);
      border-radius: 2px;
      animation: progressBar 2.5s ease-in-out infinite;
    }

    @keyframes floatAndPulse {
      0% {
        transform: translateX(-50%) translateY(0) scale(1);
        opacity: 1;
      }
      50% {
        transform: translateX(-50%) translateY(-10px) scale(1.03);
        opacity: 0.95;
      }
      100% {
        transform: translateX(-50%) translateY(0) scale(1);
        opacity: 1;
      }
    }

    @keyframes progressBar {
      0% {
        left: -50%;
        width: 50%;
      }
      40% {
        width: 35%;
      }
      50% {
        left: 50%;
        width: 30%;
      }
      100% {
        left: 100%;
        width: 70%;
      }
    }

    /* --- Sincronización de la sesión inyectada por el contenedor --- */
    #sync-loader {
      position: fixed;
      inset: 0;
      z-index: 100000;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(245, 250, 253, 0.94);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      color: #0c2d48;
      font-family: 'Inter', Arial, sans-serif;
      transition: opacity 0.4s ease;
      pointer-events: auto;
    }

    .sync-loader-content {
      text-align: center;
      animation: syncFadeIn 0.8s ease-out;
      background: #fff;
      padding: 3rem;
      border-radius: 30px;
      box-shadow: 0 20px 60px rgba(12, 45, 72, 0.15);
      border: 1px solid rgba(0, 201, 167, 0.2);
    }

    .sync-spinner-box {
      position: relative;
      width: 80px;
      height: 80px;
      margin: 0 auto 25px;
    }

    .sync-circle-outer {
      width: 100%;
      height: 100%;
      border: 4px solid rgba(0, 201, 167, 0.1);
      border-top: 4px solid #00c9a7;
      border-radius: 50%;
      animation: syncSpin 1.2s cubic-bezier(0.5, 0, 0.5, 1) infinite;
    }

    .sync-circle-inner {
      position: absolute;
      top: 20%;
      left: 20%;
      width: 60%;
      height: 60%;
      border: 4px solid rgba(12, 45, 72, 0.1);
      border-bottom: 4px solid #0c2d48;
      border-radius: 50%;
      animation: syncSpinReverse 0.8s cubic-bezier(0.5, 0, 0.5, 1) infinite;
    }

    .sync-loader-title {
      font-size: 1.2rem;
      font-weight: 700;
      letter-spacing: 2px;
      margin-bottom: 8px;
      text-transform: uppercase;
      color: #0c2d48;
    }

    .sync-loader-subtitle {
      font-size: 0.85rem;
      color: #607d8b;
      font-weight: 400;
      letter-spacing: 0.5px;
    }

    @keyframes syncSpin {
      0% {
        transform: rotate(0deg);
      }
      100% {
        transform: rotate(360deg);
      }
    }

    @keyframes syncSpinReverse {
      0% {
        transform: rotate(0deg);
      }
      100% {
        transform: rotate(-360deg);
      }
    }

    @keyframes syncFadeIn {
      from {
        opacity: 0;
        transform: translateY(10px) scale(0.95);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }
  </style>
</head>
<body class="mat-typography">
  <core-loading-screen id="loading-bg">
    <div class="loading-logo" id="loading-logo-container">
      <!-- Isotipo animado (misma composición que el login, en bucle) -->
      <svg
        width="320"
        height="208"
        viewBox="0 0 400 260"
        fill="none"
        xmlns="http://www.w3.org/2000/svg"
        role="img"
        aria-label="Cargando FirmaLink"
      >
        <defs>
          <mask
            id="iso-cut-mask-loader"
            maskUnits="userSpaceOnUse"
            x="0"
            y="0"
            width="400"
            height="260"
          >
            <rect x="0" y="0" width="400" height="260" fill="#fff" />
            <path d="M 160 130 A 45 45 0 0 0 205 175" stroke="#000" stroke-width="38" fill="none" />
            <path
              d="M 160 130 A 45 45 0 0 0 205 175"
              stroke="#000"
              stroke-width="38"
              stroke-linecap="round"
              fill="none"
            />
            <path
              class="iso-anim-check"
              d="M 205 130 L 235 160 L 315 65"
              stroke="#000"
              stroke-width="38"
              stroke-linecap="round"
              stroke-linejoin="round"
              fill="none"
            />
            <path
              class="iso-anim-check"
              d="M 205 130 L 235 160 L 315 65"
              stroke="#fff"
              stroke-width="22"
              stroke-linecap="round"
              stroke-linejoin="round"
              fill="none"
            />
          </mask>
        </defs>

        <g class="iso-anim-links">
          <g mask="url(#iso-cut-mask-loader)">
            <rect
              x="50"
              y="85"
              width="150"
              height="90"
              rx="45"
              style="stroke: var(--primary, #0c2d48)"
              stroke-width="26"
              fill="none"
            />
            <rect
              x="160"
              y="85"
              width="150"
              height="90"
              rx="45"
              style="stroke: var(--accent, #00c9a7)"
              stroke-width="26"
              fill="none"
            />
          </g>
          <path
            d="M 160 130 A 45 45 0 0 0 205 175"
            style="stroke: var(--primary, #0c2d48)"
            stroke-width="26"
            fill="none"
          />
        </g>

        <g class="iso-anim-check">
          <path
            d="M 205 130 L 235 160 L 315 65"
            style="stroke: var(--accent, #00c9a7)"
            stroke-width="22"
            stroke-linecap="round"
            stroke-linejoin="round"
            fill="none"
          />
        </g>
      </svg>
    </div>
    <div class="loading"></div>
  </core-loading-screen>

  <!-- Capa de sincronización cuando el contenedor inyecta la sesión -->
  <div
    id="sync-loader"
    role="status"
    aria-live="polite"
    aria-label="Sincronizando sesión"
  >
    <div class="sync-loader-content">
      <div class="sync-spinner-box">
        <div class="sync-circle-outer"></div>
        <div class="sync-circle-inner"></div>
      </div>
      <div class="sync-loader-title">Sincronizando</div>
      <div class="sync-loader-subtitle">Estableciendo conexión segura...</div>
    </div>
  </div>

  <app-root></app-root>

  <script>
    (function () {
      // Puente con el contenedor de escritorio (Tauri/Electron).
      // El contenedor inyecta la sesión y el contexto de red en el iframe.
      const APP_ID = 'sandra.app.firmalink';
      const MAX_BODY_LENGTH = 5000;
      const SESSION_RELOAD_DELAY_MS = 2800;
      const INTERCEPT_CONSOLE = false;
      const EMBEBIDO = window.parent && window.parent !== window;

      const original = {
        log: console.log,
        error: console.error,
        fetch: window.fetch,
        xhr: window.XMLHttpRequest,
      };

      const sendToParent = (tipo, mensaje, detalles = null) => {
        if (!EMBEBIDO) return;
        try {
          window.parent.postMessage(
            {
              type: 'SDC_LOG',
              app_id: APP_ID,
              source: 'external-proxy',
              payload: {
                app_id: APP_ID,
                source: 'external-proxy',
                log_type: tipo,
                message: mensaje,
                details: detalles,
              },
            },
            '*',
          );
        } catch (error) {
          // El puente de logs nunca debe romper la aplicación.
          original.error('[FirmaLink] No se pudo enviar el log al contenedor:', error);
        }
      };

      const truncar = (texto) => {
        if (!texto) return '[No Body]';
        return texto.length > MAX_BODY_LENGTH
          ? texto.substring(0, MAX_BODY_LENGTH) + '... (truncated)'
          : texto;
      };

      const describirBody = (body) => {
        if (body === null || body === undefined) return null;
        if (typeof body === 'string') return truncar(body);
        if (body instanceof URLSearchParams) return truncar(body.toString());
        return `[Body: ${Object.prototype.toString.call(body)}]`;
      };

      // Headers no siempre es serializable por postMessage. Se convierte a un
      // objeto plano antes de enviarlo al contenedor.
      const serializarHeaders = (headers) => {
        if (!headers) return {};
        const plano = {};
        if (Array.isArray(headers)) {
          headers.forEach(([clave, valor]) => {
            plano[clave] = valor;
          });
          return plano;
        }
        if (typeof headers.forEach === 'function') {
          headers.forEach((valor, clave) => {
            plano[clave] = valor;
          });
          return plano;
        }
        if (typeof headers === 'object') {
          Object.keys(headers).forEach((clave) => {
            plano[clave] = headers[clave];
          });
        }
        return plano;
      };

      // Mostrar la pantalla de carga propia o, si Angular ya la retiró,
      // crear una capa equivalente para el cambio de sesión.
      const mostrarCarga = () => {
        // Capa dedicada con el mismo lenguaje visual que sssifanb.
        const sync = document.getElementById('sync-loader');
        if (sync) {
          // Evita que queden dos capas de carga superpuestas.
          const loading = document.getElementById('loading-bg');
          if (loading) loading.style.display = 'none';
          sync.style.display = 'flex';
          sync.style.opacity = '1';
          return;
        }

        const existente = document.getElementById('loading-bg');
        if (existente) {
          existente.style.display = 'block';
          existente.style.opacity = '1';
          existente.style.zIndex = '99999';
          return;
        }
        if (document.getElementById('sdc-session-loader')) return;

        const overlay = document.createElement('div');
        overlay.id = 'sdc-session-loader';
        overlay.setAttribute(
          'style',
          [
            'position:fixed',
            'inset:0',
            'z-index:99999',
            'display:flex',
            'align-items:center',
            'justify-content:center',
            'background:#fff',
            'color:#0c2d48',
            'font-family:Inter,Arial,sans-serif',
            'font-size:15px',
            'letter-spacing:.02em',
          ].join(';'),
        );
        overlay.textContent = 'Sincronizando sesión...';
        document.body.appendChild(overlay);
      };

      const limpiarSesionLocal = () => {
        ['token', 'token_sandra', 'menu', 'crypt', 'token_failed'].forEach(
          (clave) => sessionStorage.removeItem(clave),
        );
      };

      window.addEventListener('message', (event) => {
        const data = event && event.data;
        if (!data || typeof data !== 'object') return;

        if (data.type === 'NETWORK_CONTEXT') {
          try {
            sessionStorage.setItem('net_info', JSON.stringify(data.payload));
          } catch (error) {
            original.error('[FirmaLink] No se pudo guardar net_info:', error);
          }
          return;
        }

        if (data.type === 'SET_SESSION') {
          const token = typeof data.token === 'string' ? data.token.trim() : '';
          if (!token) return;

          const tokenActual = sessionStorage.getItem('token');
          const tokenFallido = sessionStorage.getItem('token_failed');
          if (tokenActual === token || tokenFallido === token) return;

          mostrarCarga();

          setTimeout(() => {
            // Un token nuevo invalida el menú y la huella de la sesión anterior.
            sessionStorage.removeItem('menu');
            sessionStorage.removeItem('crypt');
            sessionStorage.removeItem('token_failed');
            sessionStorage.setItem('token', token);
            // Compatibilidad con el puente anterior del contenedor.
            sessionStorage.setItem('token_sandra', token);
            window.location.reload();
          }, SESSION_RELOAD_DELAY_MS);
          return;
        }

        if (data.type === 'CLEAR_SESSION') {
          const habiaSesion =
            sessionStorage.getItem('token') || sessionStorage.getItem('menu');
          limpiarSesionLocal();
          if (habiaSesion) window.location.reload();
        }
      });

      // ── Monitor de errores hacia el contenedor ──────────────────────────
      // En Angular 22 el override de console.* interfiere con zone.js: cada
      // llamada encola un postMessage y dispara microtareas durante la
      // detección de cambios. Se deja apagado por defecto; activarlo solo si
      // se está depurando el contenedor.
      if (EMBEBIDO && INTERCEPT_CONSOLE) {
        console.error = (...args) => {
          original.error.apply(console, args);
          const mensaje = args
            .map((a) => (a instanceof Error ? `${a.message}\n${a.stack}` : a))
            .join(' ');
          sendToParent('ERROR', mensaje);
        };

        console.log = (...args) => {
          original.log.apply(console, args);
          const mensaje = args
            .map((a) => {
              if (a instanceof Error) return `${a.message}\n${a.stack}`;
              if (typeof a === 'object' && a !== null) {
                try {
                  return JSON.stringify(a, null, 2);
                } catch {
                  return String(a);
                }
              }
              return a;
            })
            .join(' ');
          sendToParent('LOG', mensaje);
        };
      }

      if (EMBEBIDO) {
        // Fetch con .then() en lugar de async/await: evita microtareas
        // adicionales dentro del ciclo de detección de cambios de Angular.
        window.fetch = function () {
          const args = arguments;
          const resource = args[0];
          const config = args[1] || {};
          const url = typeof resource === 'string' ? resource : String(resource);
          const method = config.method || 'GET';
          const requestBody = describirBody(config.body);

          return original.fetch.apply(window, args).then(
            (response) => {
              if (response.status >= 400) {
                response
                  .clone()
                  .text()
                  .then((body) =>
                    sendToParent(
                      'FETCH',
                      `HTTP Error ${response.status} ${method} ${url}`,
                      {
                        url: response.url || url,
                        method,
                        status: response.status,
                        request_headers: serializarHeaders(config.headers),
                        request_payload: requestBody,
                        response_body: truncar(body),
                        source: 'external-app',
                      },
                    ),
                  )
                  .catch(() => {});
              }
              return response;
            },
            (error) => {
              sendToParent('ERROR', `Fetch Exception: ${url} - ${error.message}`, {
                url,
                error: error.message,
              });
              throw error;
            },
          );
        };

        window.XMLHttpRequest = function () {
          const xhr = new original.xhr();
          let method = 'GET';
          let url = '';
          let requestBody = null;
          const requestHeaders = {};

          const originalOpen = xhr.open;
          xhr.open = function (m, u) {
            method = m;
            url = u;
            return originalOpen.apply(xhr, arguments);
          };

          const originalSetRequestHeader = xhr.setRequestHeader;
          xhr.setRequestHeader = function (header, value) {
            requestHeaders[header] = value;
            return originalSetRequestHeader.apply(xhr, arguments);
          };

          const originalSend = xhr.send;
          xhr.send = function (body) {
            requestBody = describirBody(body);
            return originalSend.apply(xhr, arguments);
          };

          xhr.addEventListener('loadend', function () {
            if (xhr.status < 400) return;
            if (url && url.indexOf('dwscdn') !== -1 && xhr.status === 409) return;

            let responseBody = '[No Body]';
            if (xhr.responseType === '' || xhr.responseType === 'text') {
              try {
                responseBody = xhr.responseText || '[No Body]';
              } catch {
                responseBody = '[Error reading responseText]';
              }
            } else if (xhr.responseType === 'blob') {
              responseBody = '[Blob Content]';
            } else {
              responseBody = `[Response Type: ${xhr.responseType}]`;
            }

            sendToParent('FETCH', `XHR Error ${xhr.status} ${method} ${url}`, {
              url: xhr.responseURL || url,
              method,
              status: xhr.status,
              request_headers: requestHeaders,
              request_payload: requestBody,
              response_body: truncar(responseBody),
              source: 'external-app',
            });
          });

          xhr.addEventListener('error', function () {
            sendToParent('ERROR', `XHR Network Exception: ${method} ${url}`, {
              url,
              method,
            });
          });

          return xhr;
        };

        Object.assign(window.XMLHttpRequest, original.xhr);
      }
    })();
  </script>
</body>
</html>
