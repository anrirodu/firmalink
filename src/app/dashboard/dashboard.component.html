<!-- ═══════════════════════════════════════════
     WELCOME
     ═══════════════════════════════════════════ -->
<section class="welcome-section">
  <h1>Bienvenido a FirmaLink</h1>
  <p>
    Firmas electrónicas, acuerdos, trámites y contrataciones en línea con
    certificación digital.
  </p>
</section>

<!-- ═══════════════════════════════════════════
     ACCIONES RÁPIDAS
     ═══════════════════════════════════════════ -->
<section class="actions-section">
  <h2 class="section-title">¿Qué desea realizar?</h2>
  <div class="actions-grid">
    <button
      type="button"
      class="action-card"
      *ngFor="let accion of acciones"
      [style.background]="accion.bg"
      (click)="onAccion(accion)"
    >
      <mat-icon class="action-icon">{{ accion.icono }}</mat-icon>
      <span class="action-title">{{ accion.titulo }}</span>
      <span class="action-desc">{{ accion.descripcion }}</span>
      <mat-icon class="action-arrow">arrow_forward</mat-icon>
    </button>
  </div>
</section>
