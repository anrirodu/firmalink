<div class="misc-wrapper">
  <!-- Background animado -->
  <div class="background-shapes">
    <div class="shape shape1"></div>
    <div class="shape shape2"></div>
    <div class="shape shape3"></div>
  </div>

  <div class="misc-inner d-flex flex-column align-items-center justify-content-center p-4">
    <div class="w-100 text-center">
      <!-- Logo -->
      <div class="logo-container mb-4">
        <img src="assets/images/logo.png" alt="FirmaLink" class="logo-firmalink" />
      </div>

      <!-- Icono de candado cerrado -->
      <div class="lock-icon mb-4">
        <svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          <line x1="12" y1="15" x2="12" y2="18"></line>
        </svg>
      </div>

      <h1 class="mb-2 font-weight-bolder title-firmalink">Usted no está autorizado</h1>
      <p class="mb-4 text-muted">
        No tienes permisos para acceder a esta página.<br />
        Te recomendamos regresar o cerrar sesión.
      </p>

      <div class="btn-group-custom">
        <button class="btn btn-warning-custom me-3" (click)="goHome()">
          <i class="fas fa-home me-2"></i> Ir al Inicio
        </button>
        <button class="btn btn-danger-custom" (click)="logout()">
          <i class="fas fa-sign-out-alt me-2"></i> Cerrar Sesión
        </button>
      </div>
    </div>
  </div>
</div>
