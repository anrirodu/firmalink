<div class="misc-wrapper">
  <!-- Background animado -->
  <div class="background-shapes">
    <div class="shape shape1"></div>
    <div class="shape shape2"></div>
    <div class="shape shape3"></div>
  </div>

  <div class="misc-inner d-flex flex-column align-items-center justify-content-center p-4">
    <div class="w-100 text-center">
      <!-- Logo -->
      <div class="logo-container mb-4">
        <img src="assets/images/logo.png" alt="FirmaLink" class="logo-firmalink" />
      </div>

      <!-- Icono de herramientas animado -->
      <div class="tools-icon mb-4">
        <svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"></path>
        </svg>
      </div>

      <h1 class="mb-2 font-weight-bolder title-firmalink">Sistema en Mantenimiento</h1>
      <p class="mb-4 text-muted">
        Disculpe las molestias, pero estamos realizando un mantenimiento programado.<br />
        El sistema estará disponible nuevamente pronto.
      </p>

      <div class="maintenance-info mb-4">
        <div class="info-card">
          <i class="fas fa-clock me-2"></i> Tiempo estimado: Próximamente
        </div>
      </div>

      <button class="btn btn-firmalink-gradient btn-lg" (click)="goHome()">
        <i class="fas fa-home me-2"></i> Volver al Inicio
      </button>
    </div>
  </div>
</div>
